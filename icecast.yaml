apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: icecast-logs
  namespace: airadio
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: icecast-config
  namespace: airadio
type: Opaque
stringData:
  icecast.xml: |
    <?xml version="1.0"?>
    <icecast>
      <limits>
        <clients>100</clients>
        <sources>10</sources>
        <threadpool>8</threadpool>
        <queue-size>262144</queue-size>
        <client-timeout>30</client-timeout>
        <header-timeout>15</header-timeout>
        <source-timeout>10</source-timeout>
        <burst-on-connect>1</burst-on-connect>
        <burst-size>65536</burst-size>
      </limits>
      <authentication>
        <source-password>sourcepass</source-password>
        <relay-password>relaypass</relay-password>
        <admin-user>admin</admin-user>
        <admin-password>hackme</admin-password>
      </authentication>
      <hostname>localhost</hostname>
      <listen-socket>
        <port>8000</port>
      </listen-socket>
      <http-headers>
        <header name="Access-Control-Allow-Origin" value="*" />
      </http-headers>
      <logging>
        <accesslog>-</accesslog>
        <errorlog>-</errorlog>
        <loglevel>3</loglevel>
      </logging>
      <security>
        <ssl>0</ssl>
      </security>
    </icecast>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: icecast
  namespace: airadio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: icecast
  template:
    metadata:
      labels:
        app.kubernetes.io/name: icecast
    spec:
      containers:
        - name: icecast
          image: infiniteproject/icecast:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: stream
              containerPort: 8000
            - name: admin
              containerPort: 8000
          env:
            - name: ICECAST_SOURCE_PASSWORD
              value: sourcepass
            - name: ICECAST_RELAY_PASSWORD
              value: relaypass
            - name: ICECAST_ADMIN_PASSWORD
              value: hackme
          readinessProbe:
            httpGet:
              path: /status.xsl
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /status.xsl
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: icecast
  namespace: airadio
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: icecast
  ports:
    - name: stream
      port: 8030
      targetPort: stream
      protocol: TCP
    - name: admin
      port: 8031
      targetPort: admin
      protocol: TCP
