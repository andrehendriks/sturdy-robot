---
apiVersion: v1
kind: Service
metadata:
  name: webui
  namespace: airadio
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
  selector:
    app: webui
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: webui-controller
  namespace: airadio
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: webui-liquidsoap-controller
  namespace: airadio
rules:
- apiGroups:
  - apps
  resources:
  - deployments/scale
  resourceNames:
  - liquidsoap
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: webui-liquidsoap-controller
  namespace: airadio
subjects:
- kind: ServiceAccount
  name: webui-controller
  namespace: airadio
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: webui-liquidsoap-controller
---
apiVersion: v1
kind: Service
metadata:
  name: liquidsoap
  namespace: airadio
spec:
  ports:
  - name: telnet
    port: 1234
    targetPort: 1234
  selector:
    app: liquidsoap
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webui
  namespace: airadio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webui
  template:
    metadata:
      labels:
        app: webui
    spec:
      serviceAccountName: webui-controller
      containers:
      - name: webui
        image: airadio-webui:local
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 3000
